<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" font-family="Inter, system-ui, sans-serif">
  <style>
    .label { font-size: 13px; font-weight: 600; fill: #f5f5f4; }
    .sub { font-size: 11px; fill: #a8a29e; }
    .arrow { stroke: #57534e; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .step-label { font-size: 11px; fill: #78716c; font-weight: 500; letter-spacing: 0.06em; }
    .highlight { stroke: #d97706; stroke-width: 1.5; }
    .highlight-end { stroke: #16a34a; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="820" height="220" fill="#1c1917" rx="12"/>

  <!-- Title -->
  <text x="410" y="28" text-anchor="middle" font-size="12" font-weight="600" fill="#78716c" letter-spacing="0.08em">RETRIEVAL + GENERATION</text>

  <!-- Step 1: User Query -->
  <rect x="20" y="70" width="120" height="70" fill="#292524" stroke="#d97706" stroke-width="1.5" rx="8"/>
  <text x="80" y="100" text-anchor="middle" class="label">User Query</text>
  <text x="80" y="118" text-anchor="middle" class="sub">"What is your</text>
  <text x="80" y="131" text-anchor="middle" class="sub">refund policy?"</text>

  <!-- Arrow -->
  <line x1="142" y1="105" x2="162" y2="105" class="arrow"/>

  <!-- Step 2: Embed Query -->
  <rect x="164" y="70" width="120" height="70" fill="#292524" stroke="#44403c" stroke-width="1" rx="8"/>
  <text x="224" y="100" text-anchor="middle" class="label">Embed Query</text>
  <text x="224" y="118" text-anchor="middle" class="sub">Same embedding</text>
  <text x="224" y="131" text-anchor="middle" class="sub">model as index</text>

  <!-- Arrow -->
  <line x1="286" y1="105" x2="306" y2="105" class="arrow"/>

  <!-- Step 3: Vector Search -->
  <rect x="308" y="70" width="120" height="70" fill="#292524" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <text x="368" y="100" text-anchor="middle" class="label">Vector Search</text>
  <text x="368" y="118" text-anchor="middle" class="sub">Nearest-neighbor</text>
  <text x="368" y="131" text-anchor="middle" class="sub">in vector DB</text>

  <!-- Arrow -->
  <line x1="430" y1="105" x2="450" y2="105" class="arrow"/>

  <!-- Step 4: Top-K Chunks -->
  <rect x="452" y="50" width="120" height="30" fill="#292524" stroke="#44403c" stroke-width="1" rx="6"/>
  <text x="512" y="70" text-anchor="middle" font-size="11" fill="#a8a29e">chunk_42</text>

  <rect x="452" y="90" width="120" height="30" fill="#292524" stroke="#44403c" stroke-width="1" rx="6"/>
  <text x="512" y="110" text-anchor="middle" font-size="11" fill="#a8a29e">chunk_7</text>

  <rect x="452" y="130" width="120" height="30" fill="#292524" stroke="#44403c" stroke-width="1" rx="6"/>
  <text x="512" y="150" text-anchor="middle" font-size="11" fill="#a8a29e">chunk_91</text>

  <text x="512" y="38" text-anchor="middle" class="step-label">TOP-K CHUNKS</text>

  <!-- Arrow from chunks to LLM -->
  <line x1="574" y1="105" x2="594" y2="105" class="arrow"/>

  <!-- Step 5: LLM -->
  <rect x="596" y="70" width="120" height="70" fill="#292524" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="656" y="97" text-anchor="middle" class="label">LLM</text>
  <text x="656" y="115" text-anchor="middle" class="sub">Reads context,</text>
  <text x="656" y="128" text-anchor="middle" class="sub">reasons, answers</text>

  <!-- Arrow -->
  <line x1="718" y1="105" x2="738" y2="105" class="arrow"/>

  <!-- Step 6: Answer -->
  <rect x="740" y="70" width="60" height="70" fill="#292524" stroke="#16a34a" stroke-width="1.5" rx="8"/>
  <text x="770" y="100" text-anchor="middle" class="label">Answer</text>
  <text x="770" y="118" text-anchor="middle" font-size="18" fill="#16a34a">✓</text>

  <!-- Step numbers -->
  <text x="80" y="188" text-anchor="middle" class="step-label">① QUERY</text>
  <text x="224" y="188" text-anchor="middle" class="step-label">② EMBED</text>
  <text x="368" y="188" text-anchor="middle" class="step-label">③ SEARCH</text>
  <text x="512" y="188" text-anchor="middle" class="step-label">④ RETRIEVE</text>
  <text x="656" y="188" text-anchor="middle" class="step-label">⑤ GENERATE</text>
</svg>
